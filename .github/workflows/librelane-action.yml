name: Run Librelane Workflow

on: [workflow_dispatch, workflow_call]

jobs:
  Run-Librelane-Workflow:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Clone IHP PDK repo
        run: |
         git clone --branch dev --recurse-submodules https://github.com/IHP-GmbH/IHP-Open-PDK.git
         cd IHP-Open-PDK
         git clone https://github.com/IHP-GmbH/ihp-sg13cmos5l.git

      - name: Run Librelane Action
        # You may pin to the exact commit or the version.
        # uses: fossi-foundation/librelane-action@ea7ab2054b7e8e5903357b39b20ff3c2ff2f90c2
        uses: fossi-foundation/librelane-action@v0.1
        with:
          # The GitHub repository to clone
          #repo: # optional, default is https://github.com/librelane/librelane
          # The version or branch to checkout
          branch: 3.0.4 # optional, default is 2.4.0
          # The working directory to run Librelane in
          working-directory: syn # optional, default is .
          # The arguments to pass to Librelane
          #arguments: --pdk ihp-sg13g2 ../syn/librelane_config.json
          arguments: --pdk ihp-sg13cmos5l --pdk-root /home/runner/work/digital_workflow/digital_workflow/IHP-Open-PDK --manual-pdk ../syn/librelane_config.json

      - name: Upload Librelane logs
        uses: actions/upload-artifact@v7
        with:
          name: librelane-logs
          path: syn
