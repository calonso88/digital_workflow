name: Behavioural Simulation Workflow with Verilator

on: [workflow_dispatch, workflow_call]

jobs:
  Run-Behavioural-Simulation-Verilator-Workflow:
    runs-on: ubuntu-24.04

    env:
      VERILATOR_VERSION: "5.052"
    
    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Install prerequisite packages
      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make g++ libfl-dev zlib1g-dev ccache autoconf numactl perl-doc

      - name: Clone and compile Verilator
        run: |
          git clone --depth 1 --branch v${{ env.VERILATOR_VERSION }} https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure --prefix=/home/runner/verilator-dist
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: |
          echo "/home/runner/verilator-dist/bin" >> $GITHUB_PATH

      - name: Verify Verilator Version
        run: |
          verilator --version

      # Set Python up
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Get python packages
      - name: Install Python packages
        shell: bash
        run: pip install -r tb/bin/requirements.txt

      # Run simulation
      - name: Run tests
        run: |
          cd tb
          make clean SIM=verilator
          make SIM=verilator
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      # Collect results
      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: "tb/results.xml"

      # Upload simulation wave dump
      - name: Upload Waveform and Test Results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: behavioural_test_results_verilator
          path: |
            tb/dump.vcd
            tb/dump.fst
            tb/results.xml
