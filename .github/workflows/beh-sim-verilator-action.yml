name: Behavioural Simulation Workflow with Verilator

on: [workflow_dispatch, workflow_call]

jobs:
  Run-Behavioural-Simulation-Verilator-Workflow:
    runs-on: ubuntu-24.04
    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Set Python up
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Get python packages
      - name: Install Python packages
        shell: bash
        run: pip install -r tb/bin/requirements.txt

      # Install Verilator
      - name: Install verilator
        shell: bash
        run: |
          wget http://ftp.dk.debian.org/debian/pool/main/s/sphinx-rtd-theme/sphinx-rtd-theme-common_3.1.0+dfsg-1_all.deb
          wget http://ftp.dk.debian.org/debian/pool/main/s/sphinx/libjs-sphinxdoc_9.1.0-3_all.deb
          wget http://ftp.dk.debian.org/debian/pool/main/v/verilator/verilator_5.048-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./sphinx-rtd-theme-common_3.1.0+dfsg-1_all.deb
          sudo apt-get install -y ./libjs-sphinxdoc_9.1.0-3_all.deb
          sudo apt-get install -y ./verilator_5.048-1_amd64.deb

      # Run simulation
      - name: Run tests
        run: |
          cd tb
          make clean SIM=verilator
          make SIM=verilator
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      # Collect results
      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: "tb/results.xml"

      # Upload simulation wave dump
      - name: Upload Waveform and Test Results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: behavioural_test_results_verilator
          path: |
            tb/dump.vcd
            tb/dump.fst
            tb/results.xml
