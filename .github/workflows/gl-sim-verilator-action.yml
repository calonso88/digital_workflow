name: Gate Level Simulation Workflow with Verilator

on: [workflow_dispatch, workflow_call]

jobs:
  Run-Gate-Level-Simuation-Verilator-Workflow:
    runs-on: ubuntu-24.04

    env:
      PROJ_NAME: "workflow_sandbox"
      VERILATOR_VERSION: "5.052"

    steps:

      # Download Librelane artifact
      - name: Download GDS artifact
        uses: actions/download-artifact@v8
        with:
          name: librelane-logs
          path: librelane_logs_dir

      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          path: ${{ env.PROJ_NAME }}

      # Copy gate level netlist
      - name : Copy Gate Level netlist from artifact
        shell: bash
        run: |
          find librelane_logs_dir \
          -path "*/final/nl/i2c_slave.nl.v" \
          -type f \
          -exec cp {} ${{ env.PROJ_NAME }}/tb/gate_level_netlist.v \;

      # Install Verilator prerequisite packages
      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make g++ libfl-dev zlib1g-dev ccache autoconf numactl perl-doc

      # Checkout Verilator
      - name: Checkout Verilator
        uses: actions/checkout@v7
        with:
          repository: verilator/verilator
          ref: v5.052 # Optional: Specify a tag/version, or remove this line for 'master'
          path: verilator

      # Compile Verilator
      - name: Compile Verilator
        run: |
          cd verilator
          autoconf
          ./configure --prefix=$HOME/verilator
          make -j$(nproc)
          make install

      # Adds verilator to PATH
      - name: Add Verilator to PATH
        run: |
          echo "$HOME/verilator/bin" >> $GITHUB_PATH

      # Sanity check Verilator version
      - name: Verify Verilator Version
        run: |
          verilator --version

      # Set Python up
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Install required packages
      - name: Install Python packages
        shell: bash
        run: pip install -r ${{ env.PROJ_NAME }}/tb/bin/requirements.txt

      # Checkout IHP Open PDK repository
      - name: Checkout IHP Open PDK
        uses: actions/checkout@v7
        with:
          repository: IHP-GmbH/IHP-Open-PDK
          ref: dev # Optional: Specify a tag/version, or remove this line for 'master'
          submodules: recursive
          path: IHP-Open-PDK

      # Set PDK_ROOT
      - name: Configure PDK_ROOT environment variable
        shell: bash
        run: |
          echo "PDK_ROOT=$(pwd)/IHP-Open-PDK/ihp-sg13g2" >> "$GITHUB_ENV"

      # Run simulation
      - name: Run Gate Level Simulation tests
        shell: bash
        run: |
          cd ${{ env.PROJ_NAME }}/tb
          rm -f tb.vcd tb.fst results.xml
          make clean SIM=verilator
          make SIM=verilator GATES=yes
          # `make` will return success even if the tests fail, so check for failure in results.xml
          ! grep failure results.xml

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: ${{ env.PROJ_NAME }}/tb/results.xml

      - name: Upload Waveform and Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
            name: gatelevel_test_results_verilator
            path: |
              ${{ env.PROJ_NAME }}/tb/dump.vcd
              ${{ env.PROJ_NAME }}/tb/dump.fst
              ${{ env.PROJ_NAME }}/tb/results.xml