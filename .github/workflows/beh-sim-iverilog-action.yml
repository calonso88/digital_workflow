name: Behavioural Simulation Workflow with iverilog

on: [workflow_dispatch, workflow_call]

jobs:
  Run-Behavioural-Simulation-Iverilog-Workflow:
    runs-on: ubuntu-24.04

    env:
      PROJ_NAME: "workflow_sandbox"

    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          path: ${{ env.PROJ_NAME }}

      # Install icarus verilog simulator
      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Install required packages
      - name: Install Python packages
        shell: bash
        run: pip install -r ${{ env.PROJ_NAME }}/tb/bin/requirements.txt

      # Run simulation
      - name: Run tests
        run: |
          cd ${{ env.PROJ_NAME }}/tb
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      # Collect results
      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: "${{ env.PROJ_NAME }}/tb/results.xml"

      # Upload simulation wave dump
      - name: Upload Waveform and Test Results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: behavioural_test_results_iverilog
          path: |
            ${{ env.PROJ_NAME }}/tb/tb.vcd
            ${{ env.PROJ_NAME }}/tb/tb.fst
            ${{ env.PROJ_NAME }}/tb/results.xml
