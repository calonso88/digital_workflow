name: Gate Level Simulation Workflow with iverilog

on: [workflow_dispatch, workflow_call]

jobs:
  Run-Gate-Level-Simuation-Iverilog-Workflow:
    runs-on: ubuntu-24.04
    steps:

      # Download Librelane artifact
      - name: Download GDS artifact
        uses: actions/download-artifact@v8
        with:
          name: librelane-logs
          path: ~/librelane_logs_dir

      # Install PDK
      - name: Install PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ihp-sg13g2
          pdk_version: cb7daaa8901016cf7c5d272dfa322c41f024931f
          pdk_root: /home/runner/pdk

      # Get PDK from github directly, action TinyTapeout/ciel-action@v1 can be removed
      - name: Clone IHP PDK repo
        run: |
         git clone --branch dev --recurse-submodules https://github.com/IHP-GmbH/IHP-Open-PDK.git
         cd IHP-Open-PDK
         git clone https://github.com/IHP-GmbH/ihp-sg13cmos5l.git
         cd ihp-sg13cmos5l
         git checkout 1178c4fac07974139cb991e54ccf38adf86be30c

      # Install icarus verilog simulator from package as default is old and does not support std_cell verilog special commands
      - name: Install iverilog
        shell: bash
        run: |
          wget https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb

      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v7

      # Set Python up
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Install required packages
      - name: Install Python packages
        shell: bash
        run: pip install -r tb/bin/requirements.txt

      # Copy gate level netlist
      - name : Copy Gate Level netlist from artifact
        shell: bash
        run: |
          find ~/librelane_logs_dir \
          -path "*/final/nl/i2c_slave.nl.v" \
          -type f \
          -exec cp {} tb/gate_level_netlist.v \;

      # Run simulation
      - name: Run Gate Level Simulation tests
        shell: bash
        run: |
          cd tb
          rm -f tb.vcd tb.fst results.xml
          make clean
          make GATES=yes
          # `make` will return success even if the tests fail, so check for failure in results.xml
          ! grep failure results.xml

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: tb/results.xml

      - name: Upload Waveform and Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
            name: gatelevel_test_results_iverilog
            path: |
              tb/tb.vcd
              tb/tb.fst
              tb/results.xml
